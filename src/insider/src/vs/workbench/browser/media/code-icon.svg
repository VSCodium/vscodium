<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <defs>
    <clipPath id="tile">
      <rect x="85" y="90" width="1083" height="1075" rx="270" ry="270"/>
    </clipPath>

    <linearGradient id="tileBg" x1="0.85" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F8FCFE"/>
      <stop offset="1" stop-color="#E6F5FC"/>
    </linearGradient>

    <linearGradient id="cornerTL" x1="0.3" y1="0.8" x2="0.1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#C4E1F7"/>
      <stop offset="1" stop-color="#E4F2FB"/>
    </linearGradient>

    <linearGradient id="cornerBR" x1="0.2" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#C6E5F9"/>
      <stop offset="1" stop-color="#D9EEFB"/>
    </linearGradient>

    <linearGradient id="bolt" gradientUnits="userSpaceOnUse" x1="770" y1="250" x2="480" y2="1000">
      <stop offset="0" stop-color="#35D2FF"/>
      <stop offset="0.45" stop-color="#1B9AFB"/>
      <stop offset="1" stop-color="#0A5AF7"/>
    </linearGradient>

    <linearGradient id="bracket" gradientUnits="userSpaceOnUse" x1="300" y1="380" x2="300" y2="880">
      <stop offset="0" stop-color="#57C8FD"/>
      <stop offset="0.45" stop-color="#2A9EFB"/>
      <stop offset="1" stop-color="#4DB7FD"/>
    </linearGradient>

    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="200" y1="660" x2="440" y2="830">
      <stop offset="0" stop-color="#1050D0" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#1F7DEB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4DB7FD" stop-opacity="0"/>
    </linearGradient>

    <!-- Left "<" bracket; the right one is a mirrored copy -->
    <g id="bracketShape">
      <path fill="url(#bracket)" d="M 388 392
        C 420 375 470 395 470 430 L 470 455 Q 470 470 458 480
        C 400 530 335 580 268 625
        L 458 770 Q 470 782 470 796 L 470 822
        C 470 860 430 885 395 875 Q 385 872 378 867
        L 175 705 Q 148 685 147 665 L 147 595 Q 148 575 165 563
        C 250 505 320 455 388 392 Z"/>
      <path fill="url(#fold)" d="M 268 625 L 458 770 Q 470 782 470 796 L 470 822
        C 470 860 430 885 395 875 Q 385 872 378 867
        L 180 705 Q 174 690 190 677 Z"/>
    </g>
  </defs>

  <!-- Rounded tile background -->
  <g clip-path="url(#tile)">
    <rect x="85" y="90" width="1083" height="1075" fill="url(#tileBg)"/>
    <polygon points="85,80 555,80 85,466" fill="url(#cornerTL)"/>
    <polygon points="1170,766 1170,1170 548,1170" fill="url(#cornerBR)"/>
  </g>

  <!-- Brackets -->
  <use href="#bracketShape"/>
  <use href="#bracketShape" transform="translate(1255,0) scale(-1,1)"/>

  <!-- Lightning bolt -->
  <path fill="url(#bolt)" d="M 735 260
    Q 752 245 768 255 Q 782 268 776 285
    L 694 562 L 823 562 Q 840 564 840 582 Q 838 590 830 598
    C 720 740 610 880 495 997
    Q 482 1008 470 998 Q 462 990 466 980
    L 581 685 L 430 685 Q 414 683 414 668 Q 415 662 420 656
    C 500 560 620 410 735 260 Z"/>
</svg>
